<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Militares Questões</title>
<meta name="description" content="Militares Questões: banco de questões para concursos militares, feito por Vinicius Macedo">
<meta name="theme-color" content="#040905">
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/tema.css">
<link rel="stylesheet" href="css/landing.css">
<link rel="stylesheet" href="css/abertura.css">
</head>
<body>
<div id="splash" role="dialog" aria-label="Abertura"><canvas class="ab-chuva" aria-hidden="true"></canvas><div class="ab-radar" aria-hidden="true"></div><div class="ab-c"><span class="lg ab-logo"><img src="img/logo.svg" alt="" onerror="this.remove()"><svg class="fb" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="#04120a" stroke="#4ade80" stroke-width="2.5"/><text x="32" y="44" font-size="34" font-weight="700" text-anchor="middle" fill="#4ade80" font-family="Rajdhani,Inter,sans-serif">M</text></svg></span><p class="ab-k">// acesso autorizado</p><h1 class="ab-t">Militares Questões</h1><p class="ab-s">Treino para concursos militares em Português, Matemática, Física e Inglês.</p><ul class="ab-boot" aria-hidden="true"><li>iniciando módulos de estudo <b>OK</b></li><li>criptografando seu progresso <b>OK</b></li><li>conexão segura estabelecida <b>OK</b></li></ul><button class="btn" data-do="entrar">Acessar</button></div></div>
<header><div class="w">
<button class="logo" data-do="home" aria-label="Início"><span class="lg"><img src="img/logo.svg" alt="" onerror="this.remove()"><svg class="fb" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="#04120a" stroke="#4ade80" stroke-width="2.5"/><text x="32" y="44" font-size="34" font-weight="700" text-anchor="middle" fill="#4ade80" font-family="Rajdhani,Inter,sans-serif">M</text></svg></span><span>Militares Questões</span></button>
<button class="nb au" data-do="erros"><i data-i="book"></i><span>Caderno de erros</span><em id="nerr"></em></button>
<button class="nb au" data-do="rank"><i data-i="trophy"></i><span>Ranking</span></button>
<button class="nb au" data-do="desemp"><i data-i="chart"></i><span>Desempenho</span></button>
<button class="nb ad" data-do="admin"><i data-i="shield"></i><span>Admin</span></button>
<button class="nb" data-do="theme" aria-label="Alternar tema"><i data-i="moon"></i></button>
<button class="nb au" data-do="logout" aria-label="Sair"><i data-i="out"></i><span>Sair</span></button>
</div></header>
<main class="w" id="app"></main>
<div id="toast" role="status" hidden></div>

<!-- Configuração do Supabase: edite js/config.js -->
<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/icones.js"></script>
<script src="js/estado.js"></script>
<script src="js/telas.js"></script>
<script src="js/acoes.js"></script>
<script src="js/abertura.js"></script>
<script src="js/main.js"></script>
</body>
</html>
